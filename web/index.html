<!DOCTYPE html>
<html>
  <head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order
      to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      For more details:
      * https://docs.flutter.dev/platform-integration/web/initialization
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO / meta -->
    <meta name="description" content="nCalendar — Open, evidence-tagged Bikram Sambat (Nepali) calendar data commons (BS 1975–2083) rendered on GitHub Pages.">
    <meta name="keywords" content="Bikram Sambat, Nepali calendar, BS calendar, nCalendar, nCalander, panchang">
    <meta name="author" content="nCalendar">

    <!-- Open Graph / social sharing -->
    <meta property="og:title" content="nCalendar — Bikram Sambat Calendar">
    <meta property="og:description" content="Open, evidence-tagged Nepali (Bikram Sambat) calendar data commons rendered on GitHub Pages.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ncalendar.example.com/">
    <meta property="og:image" content="icons/Icon-512.png">

    <!-- Theme color for browser chrome (matches brand navy #002C6D) -->
    <meta name="theme-color" content="#002C6D">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="nCalendar">
    <title>nCalendar — Bikram Sambat Calendar</title>
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <link rel="manifest" href="manifest.json">

    <!--
      You can customize the "flutter_bootstrap.js" script.
      This is useful to provide a custom configuration to the Flutter loader
      or to give the user feedback during the initialization process.

      For more details:
      * https://docs.flutter.dev/platform-integration/web/initialization
    -->
    <script src="flutter_bootstrap.js" async></script>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
