<!DOCTYPE html>
<html>
  <head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order
      to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      For more details:
      * https://docs.flutter.dev/platform-integration/web/initialization
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO / meta -->
    <meta name="description" content="nCalendar — Open, evidence-tagged Bikram Sambat (Nepali) calendar data commons (BS 1975–2083) rendered on GitHub Pages.">
    <meta name="keywords" content="Bikram Sambat, Nepali calendar, BS calendar, nCalendar, nCalander, panchang">
    <meta name="author" content="nCalendar">

    <!-- Open Graph / social sharing -->
    <meta property="og:title" content="nCalendar — Bikram Sambat Calendar">
    <meta property="og:description" content="Open, evidence-tagged Nepali (Bikram Sambat) calendar data commons rendered on GitHub Pages.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ncalendar.example.com/">
    <meta property="og:image" content="icons/Icon-512.png">

    <!-- Theme color for browser chrome (matches brand navy #002C6D) -->
    <meta name="theme-color" content="#002C6D">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="nCalendar">
    <title>nCalendar — Bikram Sambat Calendar</title>
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <link rel="manifest" href="manifest.json">

    <!-- Preload the Flutter boot chain (relative paths resolve under
         the base href): the browser starts fetching before the parser
         reaches the async script tag at the end of body. -->
    <link rel="preload" href="flutter_bootstrap.js" as="script">
    <link rel="preload" href="flutter.js" as="script">
    <link rel="preload" href="main.dart.js" as="script">

    <!-- Loading splash: pure CSS, paints before the JS bundle
         downloads (real first content), removed on flutter-first-frame. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #002C6D;
        color: #fff;
        z-index: 9999;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .splash-inner { text-align: center; }
      .splash-logo { font-size: 2rem; font-weight: 700; }
      .splash-sub { margin-top: 0.5rem; font-size: 0.9rem; opacity: 0.8; }
      .splash-bar {
        margin: 1.25rem auto 0;
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      .splash-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #fff;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar-fill { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Loading nCalendar">
      <div class="splash-inner">
        <div class="splash-logo">nCalendar</div>
        <div class="splash-sub">Bikram Sambat calendar — loading…</div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      </div>
    </div>
    <script>
      // Remove the splash when the Flutter web engine paints its
      // first frame (flutter-first-frame is dispatched by Flutter).
      document.addEventListener("flutter-first-frame", function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        splash.style.opacity = "0";
        splash.style.transition = "opacity 150ms";
        window.setTimeout(function () { splash.remove(); }, 200);
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
