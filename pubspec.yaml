name: n_calendar
description: "nCalendar — Bikram Sambat (BS) calendar web app. Open, evidence-tagged Nepali calendar data commons rendered on GitHub Pages."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.1+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated by the "analysis_options.yaml" file located at the root of your
  # package. Use that file to activate additional lint rules.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this package, see the
# following page: https://dart.dev/tools/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application. A list that can be used with the
  # material Icons class.
  uses-material-design: true

  assets:
    - assets/bs_data.json
