name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Verify generated data is in sync
        run: python scripts/gen_bs_data.py --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web for GitHub Pages
        run: flutter build web --release --base-href "/nCalendar/" --tree-shake-icons

      - name: Bundle size report
        run: |
          {
            printf '%s\n' '## Bundle size report (deploy build)'
            printf '%s\n' ''
            printf '%s\n' '```'
            du -ah build/web | sort -rh | head -25
            printf '%s\n' ''
            du -sh build/web
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
