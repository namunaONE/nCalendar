name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Verify generated data is in sync
        run: python scripts/gen_bs_data.py --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
